[package]
name = "ainavlog-device-interface"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
btleplug = "0.13.3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9.12", features = ["vendored"] }
