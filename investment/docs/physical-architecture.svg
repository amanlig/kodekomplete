<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1570" role="img" aria-labelledby="title desc"><title id="title">Covered-call application and CIBC FX model architecture</title><desc id="desc">External data and reviewed confirmations feed private local stores, an FX training workflow, and separate dashboard and closing simulation interfaces.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#647a94"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#193149}.title{font-size:29px;font-weight:bold}.h{font-size:20px;font-weight:bold}.b{font-size:16px}.small{font-size:14px;fill:#52697f}</style><rect width="1500" height="1570" fill="#f3f6fa"/><text x="40" y="48" class="title">Covered-call application + CIBC FX model</text><text x="40" y="78" class="b">External sources → private local data → model training → browser estimates</text><rect x="40" y="110" width="420" height="175" rx="12" fill="#fff" stroke="#b8c9da"/><text x="58" y="144" class="h">Questrade API</text><text x="58" y="182" class="b">Explicit read-only quote capture</text><text x="58" y="210" class="b">Stock bids, exact call asks and Greeks</text><text x="58" y="238" class="b">Position / option-chain importers</text><rect x="540" y="110" width="420" height="175" rx="12" fill="#fff" stroke="#b8c9da"/><text x="558" y="144" class="h">Yahoo Finance</text><text x="558" y="182" class="b">Current CAD=X reference; daily history</text><text x="558" y="210" class="b">Current rate is a model INPUT</text><text x="558" y="238" class="b">Dashboard feed refresh: every 60 seconds</text><rect x="1040" y="110" width="420" height="175" rx="12" fill="#fff" stroke="#b8c9da"/><text x="1058" y="144" class="h">Reviewed CIBC confirmations</text><text x="1058" y="182" class="b">Local OCR + manual review</text><text x="1058" y="210" class="b">Stock purchase basis and opening premium</text><text x="1058" y="238" class="b">No CIBC API connection</text><rect x="40" y="360" width="420" height="175" rx="12" fill="#fff" stroke="#b8c9da"/><text x="58" y="394" class="h">investment/data + reports</text><text x="58" y="432" class="b">Holdings, quote and FX JSON snapshots</text><text x="58" y="460" class="b">Stock cost basis moved into SQLite</text><text x="58" y="488" class="b">Owner-only broker credentials stay local</text><rect x="540" y="360" width="420" height="175" rx="12" fill="#fff" stroke="#b8c9da"/><text x="558" y="394" class="h">investment/data/fx-samples.sqlite3</text><text x="558" y="432" class="b">samples + stock_cost_basis: FX / stock basis</text><text x="558" y="460" class="b">option_premiums: exact opening call records</text><text x="558" y="488" class="b">Model workflows read without modification</text><rect x="1040" y="360" width="420" height="175" rx="12" fill="#fff" stroke="#b8c9da"/><text x="1058" y="394" class="h">Dashboard settings / browser</text><text x="1058" y="432" class="b">Purchase basis saved through SQLite API</text><text x="1058" y="460" class="b">Premium form saves via localhost:8765 API</text><text x="1058" y="488" class="b">Saved premiums match exact held contracts</text><rect x="40" y="610" width="420" height="175" rx="12" fill="#e9f3ef" stroke="#b8c9da"/><text x="58" y="644" class="h">models/financials/cibc_fx/train.py</text><text x="58" y="682" class="b">Chronological split → fit earlier data → test</text><text x="58" y="710" class="b">Median adjustment per buy/sell direction</text><text x="58" y="738" class="b">Final model then refitted on eligible data</text><rect x="540" y="610" width="420" height="175" rx="12" fill="#e9f3ef" stroke="#b8c9da"/><text x="558" y="644" class="h">Local model artifacts</text><text x="558" y="682" class="b">artifacts/model.json: final parameters</text><text x="558" y="710" class="b">evaluation/holdout.json: test parameters/errors</text><text x="558" y="738" class="b">No automatic training or quote refresh</text><rect x="1040" y="610" width="420" height="175" rx="12" fill="#e9f3ef" stroke="#b8c9da"/><text x="1058" y="644" class="h">Investment simulator + AI client</text><text x="1058" y="682" class="b">investment/simulate_close.py: closing UI</text><text x="1058" y="710" class="b">close_recommendations.py: OpenAI + history</text><text x="1058" y="738" class="b">fx_model.py: adapter to independent model</text><rect x="40" y="920" width="420" height="175" rx="12" fill="#fff" stroke="#b8c9da"/><text x="58" y="954" class="h">Main dashboard · :8765</text><text x="58" y="992" class="b">chart.py → equity-chart.html</text><text x="58" y="1020" class="b">Portfolio / rollover / stock-risk tools</text><text x="58" y="1048" class="b">Still uses its editable FX assumption</text><rect x="540" y="920" width="420" height="175" rx="12" fill="#fff" stroke="#b8c9da"/><text x="558" y="954" class="h">Close today · :8766 report</text><text x="558" y="992" class="b">Predicted CIBC buy/sell conversion rates</text><text x="558" y="1020" class="b">Separate conversion per leg is assumed</text><text x="558" y="1048" class="b">Net closing cash and total position gain</text><rect x="1040" y="920" width="420" height="175" rx="12" fill="#fff" stroke="#b8c9da"/><text x="1058" y="954" class="h">Model charts · :8766 report</text><text x="1058" y="992" class="b">Observed vs fitted adjustment charts</text><text x="1058" y="1020" class="b">Chronological holdout errors</text><text x="1058" y="1048" class="b">UML component interaction diagram</text><path d="M250 285V360" fill="none" stroke="#647a94" stroke-width="2" marker-end="url(#arrow)"/><text x="263" y="325" class="small">Capture snapshots</text><path d="M750 285V360" fill="none" stroke="#647a94" stroke-width="2" marker-end="url(#arrow)"/><text x="763" y="325" class="small">Historical sample reference</text><path d="M1250 285V320H1000V345H900V410" fill="none" stroke="#647a94" stroke-width="2" marker-end="url(#arrow)"/><text x="1060" y="313" class="small">Review + save</text><path d="M1250 285V360" fill="none" stroke="#647a94" stroke-width="2" marker-end="url(#arrow)"/><text x="1263" y="325" class="small">Purchase settings</text><path d="M750 535V570H250V610" fill="none" stroke="#647a94" stroke-width="2" marker-end="url(#arrow)"/><text x="390" y="561" class="small">FX samples → read-only training</text><path d="M460 697H540" fill="none" stroke="#647a94" stroke-width="2" marker-end="url(#arrow)"/><text x="465" y="683" class="small">Fit / score</text><path d="M960 697H1040" fill="none" stroke="#647a94" stroke-width="2" marker-end="url(#arrow)"/><text x="966" y="683" class="small">Load JSON</text><path d="M250 535V550H20V890H1240V785" fill="none" stroke="#647a94" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="878" class="small">Quotes + shared SQLite basis → closing UI</text><path d="M960 450H1010V590H1250V610" fill="none" stroke="#647a94" stroke-width="2" marker-end="url(#arrow)"/><text x="1040" y="580" class="small">Premium records</text><path d="M1250 785V850H750V920" fill="none" stroke="#647a94" stroke-width="2" marker-end="url(#arrow)"/><text x="870" y="838" class="small">Embed fitted model + saved inputs</text><path d="M1250 785V920" fill="none" stroke="#647a94" stroke-width="2" marker-end="url(#arrow)"/><text x="1260" y="895" class="small">Generate charts</text><path d="M1250 535H1480V905H250V920" fill="none" stroke="#647a94" stroke-width="2" marker-end="url(#arrow)"/><text x="560" y="898" class="small">Dashboard settings + source snapshots</text><rect x="25" y="1130" width="1450" height="365" rx="15" fill="#e9f3ef" stroke="#b8c9da"/>
<text x="45" y="1168" class="h">Recommendation generation · OpenAI assessment, separate from the fitted FX model</text>
<path d="M750 1095V1190H250V1210" fill="none" stroke="#647a94" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="45" y="1210" width="420" height="210" rx="10" fill="white" stroke="#b8c9da"/>
<text x="62" y="1242" class="h">Investment app: scenario + records</text>
<text x="62" y="1277" class="b">Selected goal + entered prices and fees</text>
<text x="62" y="1305" class="b">Server recalculates FX cash flows and gain</text>
<text x="62" y="1333" class="b">Quote metadata, Greeks and source records</text>
<text x="62" y="1361" class="b">No chat history or broker credentials sent</text>
<rect x="540" y="1210" width="420" height="210" rx="10" fill="white" stroke="#b8c9da"/>
<text x="557" y="1242" class="h">OpenAI Responses API</text>
<text x="557" y="1277" class="b">Investment-only key; explicit Generate action</text>
<text x="557" y="1305" class="b">Snapshot + calculations → fresh assessment</text>
<text x="557" y="1333" class="b">No research tools; limitations in prompt</text>
<text x="557" y="1361" class="b">Save successful run + inputs in SQLite</text>
<rect x="1035" y="1210" width="420" height="210" rx="10" fill="white" stroke="#b8c9da"/>
<text x="1052" y="1242" class="h">Recommendation panel</text>
<text x="1052" y="1277" class="b">Goal, process, assessment and saved history</text>
<text x="1052" y="1305" class="b">Display original inputs and model version</text>
<text x="1052" y="1333" class="b">Changed scenario marks assessment stale</text>
<text x="1052" y="1361" class="b">No order submission; API billing applies</text>
<path d="M465 1310H540" stroke="#647a94" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M960 1310H1035" stroke="#647a94" stroke-width="2" marker-end="url(#arrow)"/>
<text x="45" y="1460" class="small">The FX model estimates rates. OpenAI assesses trade-offs; recommendation_runs stores each assessment and its input snapshot.</text>
<text x="40" y="1534" class="small">Quote refresh: explicit button → investment server → Questrade + Yahoo. No model retraining. Live-reference FX accuracy remains unvalidated.</text></svg>