<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1420" role="img" aria-labelledby="title desc"><title id="title">aiNavLog Android and iOS physical build and deployment architecture</title><desc id="desc">Windows and WSL development tools upload scoped Expo sources to EAS. Android builds use Gradle and distribute AABs through manual Google Play internal testing. iOS builds use Xcode in the cloud and EAS Submit to App Store Connect and TestFlight.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#55718b"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#163650}.title{font-size:29px;font-weight:bold}.h{font-size:21px;font-weight:bold}.b{font-size:17px}.s{font-size:15px;fill:#4c657b}</style><rect width="1480" height="1420" fill="#f2f6fa"/><text x="40" y="47" class="title">aiNavLog · build once per platform, distribute through its store</text><text x="40" y="78" class="b">Shared app identity: com.kodekomplete.com.ainavlog · current release: UI shell + labeled Electrical demo</text><rect x="40" y="105" width="1400" height="155" rx="12" fill="#e8f0f8" stroke="#b8cad9"/><text x="60" y="139" class="h">Developer computer · Windows + WSL2</text><text x="60" y="171" class="b">VS Code → shared Expo SDK 57 / React Native / TypeScript / Expo Router app</text><text x="60" y="198" class="b">Node 24 + npm · tsc typecheck · ESLint · Node tests · Expo CLI / Metro JS export</text><text x="60" y="225" class="b">UI-root EAS wrappers + eas.json + .easignore exclude private sibling projects and signing files</text><rect x="30" y="305" width="680" height="1035" rx="18" fill="#e6f3eb"/><text x="58" y="342" class="h">ANDROID</text><rect x="770" y="305" width="680" height="1035" rx="18" fill="#eaf0fc"/><text x="798" y="342" class="h">iOS</text><rect x="55" y="375" width="630" height="150" rx="12" fill="white" stroke="#b8cad9"/><text x="75" y="409" class="h">Expo EAS Build · Android/Linux worker</text><text x="75" y="441" class="b">npm run android:build · play-internal profile</text><text x="75" y="468" class="b">Gradle + Android SDK compile native release</text><text x="75" y="495" class="b">EAS-managed upload keystore signs the AAB</text><rect x="795" y="375" width="630" height="150" rx="12" fill="white" stroke="#b8cad9"/><text x="815" y="409" class="h">Expo EAS Build · macOS worker</text><text x="815" y="441" class="b">npm run ios:build · testflight profile</text><text x="815" y="468" class="b">Xcode + iOS SDK compile native release</text><text x="815" y="495" class="b">Apple distribution certificate + provisioning profile</text><path d="M370 260V375" stroke="#55718b" stroke-width="2" marker-end="url(#arrow)"/><text x="384" y="322" class="s">Scoped UI source upload</text><path d="M1110 260V375" stroke="#55718b" stroke-width="2" marker-end="url(#arrow)"/><text x="1124" y="322" class="s">Scoped UI source upload</text><rect x="55" y="590" width="630" height="130" rx="12" fill="white" stroke="#b8cad9"/><text x="75" y="624" class="h">Android artifact · .aab</text><text x="75" y="656" class="b">Android App Bundle for Google Play upload</text><text x="75" y="683" class="b">Optional preview-apk profile creates an installable APK</text><rect x="795" y="590" width="630" height="130" rx="12" fill="white" stroke="#b8cad9"/><text x="815" y="624" class="h">iOS artifact · .ipa</text><text x="815" y="656" class="b">Signed iPhone/iPad archive for App Store Connect</text><text x="815" y="683" class="b">Verify bundle ID, version/build and provisioning profile</text><path d="M370 525V590" stroke="#55718b" stroke-width="2" marker-end="url(#arrow)"/><text x="384" y="562" class="s">Download + inspect</text><path d="M1110 525V590" stroke="#55718b" stroke-width="2" marker-end="url(#arrow)"/><text x="1124" y="562" class="s">Download + inspect</text><rect x="55" y="790" width="630" height="160" rx="12" fill="white" stroke="#b8cad9"/><text x="75" y="824" class="h">Google Play Console · manual upload</text><text x="75" y="856" class="b">Owner uploads the verified AAB through the browser</text><text x="75" y="883" class="b">Play App Signing → Internal testing track</text><text x="75" y="910" class="b">Tester list + saved eligibility + opt-in link</text><rect x="795" y="790" width="630" height="160" rx="12" fill="white" stroke="#b8cad9"/><text x="815" y="824" class="h">EAS Submit → App Store Connect</text><text x="815" y="856" class="b">npm run ios:submit -- --path &lt;verified IPA&gt;</text><text x="815" y="883" class="b">Apple processing → TestFlight · app ID 6823786033</text><text x="815" y="910" class="b">Internal group: Team (Expo) + eligible testers</text><path d="M370 720V790" stroke="#55718b" stroke-width="2" marker-end="url(#arrow)"/><text x="384" y="760" class="s">Manual AAB upload</text><path d="M1110 720V790" stroke="#55718b" stroke-width="2" marker-end="url(#arrow)"/><text x="1124" y="760" class="s">IPA upload through EAS Submit</text><rect x="55" y="1020" width="630" height="170" rx="12" fill="white" stroke="#b8cad9"/><text x="75" y="1054" class="h">Google Play Store → Android installation</text><text x="75" y="1086" class="b">Windows Android Studio emulator: aiNavLog_Pixel</text><text x="75" y="1113" class="b">Pixel 7 · Android 16/API 36 · Google Play · WHPX</text><text x="75" y="1140" class="b">Physical Android phone is a separate validation target</text><text x="75" y="1167" class="b">Status: emulator install + Home launch confirmed</text><rect x="795" y="1020" width="630" height="170" rx="12" fill="white" stroke="#b8cad9"/><text x="815" y="1054" class="h">TestFlight app → physical iPhone</text><text x="815" y="1086" class="b">Apple processes the build before testing availability</text><text x="815" y="1113" class="b">Invite tester → accept invitation → install aiNavLog</text><text x="815" y="1140" class="b">iOS Simulator requires macOS/Xcode, not Windows</text><text x="815" y="1167" class="b">Status: iPhone 13 install + demo checks passed</text><path d="M370 950V1020" stroke="#55718b" stroke-width="2" marker-end="url(#arrow)"/><text x="384" y="990" class="s">Tester opts in and installs</text><path d="M1110 950V1020" stroke="#55718b" stroke-width="2" marker-end="url(#arrow)"/><text x="1124" y="990" class="s">Processed build + tester invitation</text><text x="60" y="1242" class="s">Android: internal release accepted; emulator evidence received.</text><text x="800" y="1242" class="s">iOS: iPhone 13 Electrical, navigation and reopen passed.</text><text x="60" y="1280" class="s">Build/store success is distinct from runtime validation.</text><text x="800" y="1280" class="s">App Store public release is a separate operation.</text><text x="40" y="1380" class="b">Rust/Bluetooth bridge + phone-local SQLite are future integration work; these UI/demo releases do not include them.</text></svg>